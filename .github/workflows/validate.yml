name: Validate public release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-use-read-only:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check read-only intake without vendor SDKs
        run: python -B -m unittest discover -s tests -p test_project_intake.py -v
      - name: Check optimized read-only intake
        run: python -B -O -m unittest discover -s tests -p test_project_intake.py -v
      - name: Check planning SVG primitives without optional dependencies
        run: python -B -S -m unittest discover -s tests -p test_planning_canvas.py -v
      - name: Check optimized planning SVG primitives
        run: python -B -S -O -m unittest discover -s tests -p test_planning_canvas.py -v
      - name: Generate five editable SVG references
        run: python -B -S skills/embedded-project-workflow/assets/planning-diagrams/generate_templates.py --output "${{ runner.temp }}/epw-v08-svg" --format svg
  host-business-contracts:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check actual rolling statistics C code and wrong-mean negative
        run: >-
          python -B examples/common/rolling-stats/tests/check.py
          --cc "$(command -v gcc)"
          --output "${{ runner.temp }}/epw-v06-stats"
      - name: Check actual Model without an SDK
        run: >-
          python -B examples/feature-handoff/touchgfx/tests/check_model.py
          --project examples/feature-handoff/touchgfx/implementation/user
          --cxx "$(command -v g++)"
          --output "${{ runner.temp }}/epw-v06-model"
      - name: Check Reset behavior and no-op Reset negative without an SDK
        run: >-
          python -B examples/feature-handoff/touchgfx/tests/check_model.py
          --project examples/feature-handoff/touchgfx/human-continuation
          --cxx "$(command -v g++)" --with-reset
          --output "${{ runner.temp }}/epw-v06-reset"
      - name: Keep host contract records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-business-contract-evidence
          path: |
            ${{ runner.temp }}/epw-v06-stats/*.json
            ${{ runner.temp }}/epw-v06-stats/*.log
            ${{ runner.temp }}/epw-v06-model/*.json
            ${{ runner.temp }}/epw-v06-model/*.log
            ${{ runner.temp }}/epw-v06-reset/*.json
            ${{ runner.temp }}/epw-v06-reset/*.log
          if-no-files-found: warn
      - name: Check runtime status contracts and four semantic negatives
        run: >-
          python -B examples/real-project-handoff/tests/check.py
          --cc "$(command -v gcc)"
          --output "${{ runner.temp }}/epw-v07-status"
      - name: Keep runtime status contract records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-status-host-evidence
          path: |
            ${{ runner.temp }}/epw-v07-status/*.json
            ${{ runner.temp }}/epw-v07-status/*/*.log
          if-no-files-found: warn
      - name: Exercise source archive with the host compiler
        shell: python
        run: |
          import os, pathlib, shutil, subprocess, sys, zipfile
          subprocess.run([sys.executable, '-B', 'scripts/release.py', 'pack'], check=True)
          subprocess.run([sys.executable, '-B', 'scripts/release.py', 'verify-packages'], check=True)
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'epw-source-host'
          target.mkdir()
          with zipfile.ZipFile('dist/embedded-project-workflow-source-v0.8.0-beta.2.zip') as archive:
              archive.extractall(target)
          source = target / 'embedded-project-workflow'
          subprocess.run([sys.executable, '-B', str(source / 'examples/real-project-handoff/tests/check.py'),
                          '--cc', shutil.which('gcc'), '--output', str(target / 'contracts')], check=True)
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source manifest and skill
        run: python -B scripts/release.py validate
      - name: Check controlled failures
        run: python -B scripts/release.py self-test
      - name: Check isolated runner evidence and paths
        run: python -B examples/vivado/controlled-project/tests/test_runner.py
      - name: Check MCU and UI failure handling
        run: |
          python -B examples/cubemx-rtos/tests/test_rebuild_failures.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B examples/touchgfx/tests/test_rebuild_failures.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -O examples/cubemx-rtos/tests/test_rebuild_failures.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check owned Windows process trees
        run: python -B examples/cubemx-rtos/tests/test_process_tree.py
      - name: Check narrow existing-project adapter
        run: |
          python -B -m unittest discover -s tests -p test_cubemx_rtos.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -O -m unittest discover -s tests -p test_cubemx_rtos.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check existing TouchGFX project executor
        run: |
          python -B -m unittest discover -s tests -p test_touchgfx_project.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -O -m unittest discover -s tests -p test_touchgfx_project.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare public synthetic evaluation inputs
        run: python -B evaluations/v02/prepare.py --output "${{ runner.temp }}/embedded-workflow-cases"
      - name: Check narrow SoC handoff inspection and runner failures
        run: |
          python -X utf8 -B -m unittest discover -s tests -p test_soc_handoff.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -B -O -m unittest discover -s tests -p test_soc_handoff.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -B examples/vivado/soc-handoff/tests/test_runner.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -B -O examples/vivado/soc-handoff/tests/test_runner.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -B examples/vivado/soc-handoff/tests/test_process_tree.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -B -O examples/vivado/soc-handoff/tests/test_process_tree.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -B examples/vivado/soc-handoff/tests/test_rebuild_current.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -B -O examples/vivado/soc-handoff/tests/test_rebuild_current.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare selected v03 regression inputs
        run: python -B evaluations/v03/prepare.py --output "${{ runner.temp }}/embedded-workflow-v03-cases"
      - name: Prepare v04 handoff evaluation inputs
        run: python -B evaluations/v04/prepare.py --output "${{ runner.temp }}/embedded-workflow-v04-cases"
      - name: Prepare v05 board and SoC evaluation inputs
        run: python -X utf8 -B evaluations/v05/prepare.py --output "${{ runner.temp }}/embedded-workflow-v05-cases"
      - name: Prepare original planning diagram evaluation inputs
        run: python -X utf8 -B evaluations/v08/prepare.py --output "${{ runner.temp }}/embedded-workflow-v08-cases"
      - name: Prepare independent beta2 planning inputs
        run: python -X utf8 -B evaluations/v08b2/prepare.py --output "${{ runner.temp }}/embedded-workflow-v08b2-cases"
      - name: Build release archives
        run: python -B scripts/release.py pack
      - name: Verify archive contents
        run: python -B scripts/release.py verify-packages
      - name: Exercise extracted source and Skill entrypoints
        shell: python
        run: |
          import os, pathlib, subprocess, sys, zipfile
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'epw-release-unpacked'
          target.mkdir()
          for kind, filename in [('source', 'embedded-project-workflow-source-v0.8.0-beta.2.zip'),
                                 ('skill', 'embedded-project-workflow-v0.8.0-beta.2.zip')]:
              with zipfile.ZipFile(pathlib.Path('dist') / filename) as archive:
                  archive.extractall(target / kind)
          source = target / 'source/embedded-project-workflow'
          skill = target / 'skill/embedded-project-workflow'
          subprocess.run([sys.executable, '-B', 'scripts/release.py', 'validate'], cwd=source, check=True)
          subprocess.run([sys.executable, '-B', str(skill / 'scripts/project_intake.py'), '--help'], check=True)
          subprocess.run([sys.executable, '-B', '-S', str(skill / 'assets/planning-diagrams/generate_templates.py'),
                          '--output', str(target / 'planning-svg'), '--format', 'svg'], check=True)
          for kind in ['cubemx', 'touchgfx', 'vivado']:
              subprocess.run([sys.executable, '-B', str(skill / 'scripts/project_intake.py'), 'inspect',
                              '--project', str(source / 'examples/first-use' / kind)], check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: beta-release-packages
          path: |
            dist/embedded-project-workflow-source-v0.8.0-beta.2.zip
            dist/embedded-project-workflow-v0.8.0-beta.2.zip
            dist/vivado-examples-v0.8.0-beta.2.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
